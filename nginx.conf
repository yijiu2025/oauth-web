# oauth-web 前端 Nginx 配置（SPA 静态托管 + 同源反代）
#
# 生产部署请按需改三处：
#   1. server_name：改成你的域名
#   2. proxy_pass：后端 CoreFlow 地址（默认 http://backend:3000，同源反代）
#   3. frame-ancestors：iframe SSO 场景改成父应用 origin（见 docs/engineering/deployment.md）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API 同源反代：转发前端用到的端点前缀到 CoreFlow。
    # 前缀集合与 src/api/* 里实际用到的端点对齐：
    #   /auth/*  /oauth2.1/*  /user/*  /verify/*
    #   以及两个顶层无前缀端点 /send-code、/verify-code（预留未接入，仍覆盖）
    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /oauth2.1/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /user/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /verify/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 顶层无前缀端点（精确匹配，避免误伤 SPA 回退）
    location = /send-code {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /verify-code {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源长缓存（带 hash 指纹，可放心缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退：前端路由（/authorize、/m/login 等）没有真实文件，全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后用户立刻拿到新入口
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 安全头（iframe SSO 场景用 frame-ancestors 而非 DENY，见注释顶部）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
