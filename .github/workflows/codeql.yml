name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # 每周一 18:00 UTC（北京时间周二凌晨）
    - cron: '0 18 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      # build-mode 仅在"单语言单 job"时可用，故走 1 元素 matrix（官方推荐形态）
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          # javascript-typescript 一个值覆盖 .js + .ts（不含 .vue，CodeQL 不解析 SFC）；
          # Vite 项目无需构建，显式写死最稳
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
