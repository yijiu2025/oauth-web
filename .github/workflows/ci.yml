# ============================================================================
# CI —— 提交门禁（oauth-web 独立仓）
#
# 本仓 2026-10-14 从 CoreFlow 拆出，门禁自带。本文件是**唯一入口**
# （2026-10-17 按家族 CI 规范改造，规范见 fullstack-rules → ci-conventions.md）：
#   · 共享门禁 ci-quality.yml 承载「类型 → 规范 → 单测 → 构建」；
#   · 本仓专属的静态关卡 8 项需扫 dist/ 与 dist-nopwa/ 产物，经 post-build-cmd
#     与构建**同 job** 执行 —— 拆 job 传 artifact 更脆（历史决策，勿翻案）。
#
# 🔴 共享门禁字节级一致、**禁止手改**：单一来源在 fullstack-rules 技能
#    assets/ci/ci-quality.yml，改动走技能脚本 distribute-ci.mjs 分发；
#    CI 第一步会跑 scripts/ci-quality-check.mjs 自检副本一致性。
#
# 依赖安装 npm ci --ignore-scripts：lock 已入库 → 可复现（外部用户 npm install
# 同路径）；--ignore-scripts 挡 postinstall 供应链面（esbuild 平台二进制走
# optionalDependencies，不依赖 postinstall，可安全跳过）；本仓无 husky，
# 不存在"跳过 prepare 丢钩子"问题。
#
# ⚠️ dev/prod 两组关卡（verify-all.mjs 的 ②③④）需要 dev server / preview
#    服务器（5174 / 5197 / 5189 端口），CI 里起服务反而易 flake，刻意不进 CI，
#    由本地 node e2e/verify-all.mjs 全量跑。CI 只覆盖"无服务器"部分。
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci-quality.yml
    with:
      # 静态关卡 8 项（主题目录形态 / glob 设备名 / 别名单一来源 / 内核零框架耦合 /
      # console 剥离 / any 债务 / PWA 已移除 / 包体积预算）需 dist 产物，与构建同 job
      post-build-cmd: npx vite build --outDir dist-nopwa && node e2e/verify-all.mjs --only static
